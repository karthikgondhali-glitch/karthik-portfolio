<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A995FF" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A995FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B0B12" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6" />
  <!-- Monogram K.V.G -->
  <text x="50" y="62" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">K</text>
  <circle cx="76" cy="62" r="4" fill="#38BDF8" />
</svg>
